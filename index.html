<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Overlay - Valorant Cloud</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0;}
        .panel { background: #222; padding: 20px; border-radius: 8px; width: 100%; max-width: 900px; box-sizing: border-box;}
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .team-section { background: #1a1a1a; padding: 15px; border-radius: 8px; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { color: #aaa; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        input { padding: 10px; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 15px; }
        input[type="color"] { height: 40px; padding: 2px; cursor: pointer; width: 100%; border: none; transition: 0.3s; }
        
        .search-box { display: flex; gap: 10px; }
        .search-box input { flex-grow: 1; }
        .search-box button, .btn-upload-trigger { background: #333; color: white; border: 1px solid #555; padding: 0 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .search-box button:hover, .btn-upload-trigger:hover { background: #444; }

        .logo-preview-container { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; background: #111; padding: 10px; border-radius: 6px; border: 1px solid #333;}
        .logo-preview-container img { width: 50px; height: 50px; object-fit: contain; }
        .logo-preview-container .status { font-size: 13px; color: #888; }
        .logo-url-input { display: none; }

        .color-actions { display: flex; gap: 5px; margin-bottom: 5px; }
        .btn-small { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; flex-grow: 1; transition: 0.2s; }
        .btn-small:hover { background: #444; }

        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .header-box h2 { margin: 0; color: #16e28a; }
        .btn-clear { background: #f21941; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 12px; }
        .btn-clear:hover { background: #c11232; }

        button.btn-primary { width: 100%; padding: 18px; background: #16e28a; color: #000; border: none; border-radius: 4px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; margin-top: 15px;}
        button.btn-primary:hover { background: #12b870; }

        .connection-box { background: #152438; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #2a4163; display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        .connection-box input { border: 1px solid #444; width: 150px; font-family: monospace; text-align: center; font-size: 16px; color: #0f0; }
        
        .url-section { background: #000; padding: 15px; border-radius: 6px; margin-top: 20px; border: 1px dashed #555; display: flex; flex-direction: column; gap: 10px;}
        .url-section p { margin: 0; color: #aaa; font-size: 13px; text-align: center; }
        .url-section input { border: 1px solid #16e28a; color: #0f0; text-align: center; font-family: monospace; }
        
        #status { font-weight: bold; color: orange; font-size: 14px; }
        
        .preview-box { margin-top: 30px; width: 800px; height: 450px; background: #333; border: 4px solid #222; position: relative; overflow: hidden; }
        iframe { width: 1920px; height: 1080px; border: none; transform: scale(0.4166); transform-origin: top left; pointer-events: none; }
        
        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; gap: 10px; }
            .preview-title, .preview-box, .url-section { display: none; } 
            .connection-box { flex-direction: column; text-align: center; }
            .header-box { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="panel">
        <div class="header-box">
            <h2>CONTROLE BROADCAST</h2>
            <button class="btn-clear" onclick="clearAllData()">🗑️ Limpar Tudo</button>
        </div>

        <div class="connection-box">
            <div>
                <label style="color:#fff;">🔑 ID da Sala de Sincronização:</label>
            </div>
            <input type="text" id="roomId" onchange="updateLinks()">
            <span id="status">Conectando...</span>
        </div>

        <div class="grid">
            <div class="team-section">
                <h3 style="margin-top: 0; color: #16e28a;">TIME ESQUERDA</h3>
                
                <div class="form-group">
                    <label>Buscar no VLR ou Upload:</label>
                    <div class="search-box">
                        <input type="text" id="t1_search" placeholder="Time no VLR...">
                        <button onclick="searchLogoVLR(1)">🔍</button>
                        <button class="btn-upload-trigger" onclick="document.getElementById('t1_upload').click()">📁</button>
                        <input type="file" id="t1_upload" accept="image/*" style="display:none" onchange="handleFileUpload(1, event)">
                    </div>
                </div>

                <div class="logo-preview-container">
                    <img id="t1_img_preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23333'/><text x='50%' y='55%' fill='white' font-size='40' text-anchor='middle'>?</text></svg>">
                    <span id="t1_status" class="status">Vazio</span>
                </div>
                <input type="text" id="t1_logo_url" class="logo-url-input">

                <div class="form-group"><label>Sigla Overlay:</label><input type="text" id="t1_sigla" placeholder="EX: SEN"></div>
                <div class="form-group"><label>Rounds:</label><input type="number" id="t1_score" value="0"></div>
                
                <div class="form-group">
                    <label>Cor da Base:</label>
                    <div class="color-actions">
                        <button class="btn-small" onclick="adaptColor(1)">🎨 Adaptar</button>
                        <button class="btn-small" onclick="resetColor(1)">🔄 Padrão</button>
                    </div>
                    <input type="color" id="t1_color" value="#16e28a">
                </div>
            </div>

            <div class="team-section">
                <h3 style="margin-top: 0; color: #f21941;">TIME DIREITA</h3>
                
                <div class="form-group">
                    <label>Buscar no VLR ou Upload:</label>
                    <div class="search-box">
                        <input type="text" id="t2_search" placeholder="Time no VLR...">
                        <button onclick="searchLogoVLR(2)">🔍</button>
                        <button class="btn-upload-trigger" onclick="document.getElementById('t2_upload').click()">📁</button>
                        <input type="file" id="t2_upload" accept="image/*" style="display:none" onchange="handleFileUpload(2, event)">
                    </div>
                </div>

                <div class="logo-preview-container">
                    <img id="t2_img_preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23333'/><text x='50%' y='55%' fill='white' font-size='40' text-anchor='middle'>?</text></svg>">
                    <span id="t2_status" class="status">Vazio</span>
                </div>
                <input type="text" id="t2_logo_url" class="logo-url-input">

                <div class="form-group"><label>Sigla Overlay:</label><input type="text" id="t2_sigla" placeholder="EX: EG"></div>
                <div class="form-group"><label>Rounds:</label><input type="number" id="t2_score" value="0"></div>
                
                <div class="form-group">
                    <label>Cor da Base:</label>
                    <div class="color-actions">
                        <button class="btn-small" onclick="adaptColor(2)">🎨 Adaptar</button>
                        <button class="btn-small" onclick="resetColor(2)">🔄 Padrão</button>
                    </div>
                    <input type="color" id="t2_color" value="#f21941">
                </div>
            </div>
        </div>

        <button class="btn-primary" onclick="sendDataToOBS()">ATUALIZAR OVERLAY NA LIVE</button>

        <div class="url-section">
            <p>Link fixo para o OBS (1920x1080):</p>
            <input type="text" id="obsLink" readonly onclick="this.select()">
        </div>
    </div>

    <h3 class="preview-title" style="margin-top: 20px;">PREVIEW (16:9)</h3>
    <div class="preview-box">
        <iframe id="previewIframe" src=""></iframe>
    </div>

    <script>
        const emptyLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23333'/><text x='50%' y='55%' fill='white' font-size='40' text-anchor='middle'>?</text></svg>";

        let room = localStorage.getItem('vlr_room_id') || Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('vlr_room_id', room);
        document.getElementById('roomId').value = room;

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => {
            document.getElementById('status').innerText = "🟢 Online"; document.getElementById('status').style.color = "#0f0";
        });

        function updateLinks() {
            const currentRoom = document.getElementById('roomId').value;
            localStorage.setItem('vlr_room_id', currentRoom);
            let basePath = window.location.href.split('?')[0].replace('index.html', 'overlay.html');
            if(!basePath.endsWith('overlay.html')) basePath += 'overlay.html';
            const finalUrl = basePath + '?room=' + currentRoom;
            document.getElementById('obsLink').value = finalUrl;
            document.getElementById('previewIframe').src = finalUrl;
        }

        const rgbToHex = (r, g, b) => '#' + [r, g, b].map(x => {
            const hex = x.toString(16);
            return hex.length === 1 ? '0' + hex : hex;
        }).join('');

        function resetColor(teamNum) {
            if (teamNum === 1) document.getElementById('t1_color').value = '#16e28a';
            if (teamNum === 2) document.getElementById('t2_color').value = '#f21941';
        }

        // ========================================================
        // NOVO SISTEMA DE UPLOAD COM REDIMENSIONAMENTO DE IMAGEM
        // ========================================================
        function handleFileUpload(teamNum, event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusLabel = document.getElementById(`t${teamNum}_status`);
            statusLabel.innerText = "⏳ Processando...";
            statusLabel.style.color = "orange";

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Cria um canvas para encolher a imagem e deixar leve para o servidor
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 150; // O overlay usa 45x45, 150px é mais que suficiente e super leve
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Converte a imagem encolhida para código (PNG mantém a transparência!)
                    const base64Image = canvas.toDataURL('image/png');

                    document.getElementById(`t${teamNum}_logo_url`).value = base64Image;
                    document.getElementById(`t${teamNum}_img_preview`).src = base64Image;
                    statusLabel.innerText = "✅ Upload concluído!";
                    statusLabel.style.color = "#16e28a";
                    resetColor(teamNum);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function searchLogoVLR(teamNum) {
            const query = document.getElementById(`t${teamNum}_search`).value.trim();
            if(!query) return;

            const statusLabel = document.getElementById(`t${teamNum}_status`);
            statusLabel.innerText = "⏳ Buscando...";
            statusLabel.style.color = "#aaa";

            const proxies = [
                `https://corsproxy.io/?https://www.vlr.gg/search/?q=${encodeURIComponent(query)}`,
                `https://api.codetabs.com/v1/proxy?quest=https://www.vlr.gg/search/?q=${encodeURIComponent(query)}`
            ];

            let html = null;
            for (let proxy of proxies) {
                try {
                    const response = await fetch(proxy);
                    if (response.ok) { html = await response.text(); break; }
                } catch (e) {}
            }

            if (!html) { statusLabel.innerText = "❌ Erro Proxy"; return; }

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                let foundLogo = null;
                const results = doc.querySelectorAll('a.search-item');
                for (let item of results) {
                    if (item.getAttribute('href').includes('/team/')) {
                        const img = item.querySelector('img');
                        if (img && !img.src.includes('vlr.png')) {
                            foundLogo = img.getAttribute('src');
                            if (foundLogo.startsWith('//')) foundLogo = 'https:' + foundLogo;
                            break;
                        }
                    }
                }

                if (foundLogo) {
                    document.getElementById(`t${teamNum}_logo_url`).value = foundLogo;
                    document.getElementById(`t${teamNum}_img_preview`).src = foundLogo;
                    
                    let autoSigla = query.substring(0, 3).toUpperCase();
                    document.getElementById(`t${teamNum}_sigla`).value = autoSigla;
                    
                    statusLabel.innerText = "✅ Encontrado!";
                    statusLabel.style.color = "#16e28a";
                    resetColor(teamNum);
                } else {
                    statusLabel.innerText = "❌ Não achou";
                }
            } catch (e) { statusLabel.innerText = "❌ Erro"; }
        }

        async function adaptColor(teamNum) {
            const logoUrl = document.getElementById(`t${teamNum}_logo_url`).value;
            if (!logoUrl) return;
            const statusLabel = document.getElementById(`t${teamNum}_status`);
            
            const imgForColor = new Image();
            imgForColor.crossOrigin = "Anonymous";
            
            imgForColor.src = logoUrl.startsWith('data:') ? logoUrl : `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(logoUrl)}`;
            
            imgForColor.onload = () => {
                const colorThief = new ColorThief();
                const color = colorThief.getColor(imgForColor);
                let r = color[0], g = color[1], b = color[2];
                const brilho = (r * 299 + g * 587 + b * 114) / 1000;
                if (brilho > 50) { r *= 0.4; g *= 0.4; b *= 0.4; } 
                else { r += (150-r)*0.4; g += (150-g)*0.4; b += (150-b)*0.4; }
                document.getElementById(`t${teamNum}_color`).value = rgbToHex(Math.floor(r), Math.floor(g), Math.floor(b));
                statusLabel.innerText = "🎨 Cor adaptada!";
            };
        }

        // ==========================================
        // FUNÇÃO PARA LIMPAR TUDO E COMEÇAR DO ZERO
        // ==========================================
        function clearAllData() {
            if(confirm("Tem certeza que deseja zerar o placar e remover os times?")) {
                localStorage.removeItem('vlr_overlay_data'); // Apaga a memória
                
                // Reseta os campos visuais
                document.getElementById('t1_search').value = '';
                document.getElementById('t1_logo_url').value = '';
                document.getElementById('t1_img_preview').src = emptyLogo;
                document.getElementById('t1_status').innerText = 'Vazio';
                document.getElementById('t1_status').style.color = '#888';
                document.getElementById('t1_sigla').value = '';
                document.getElementById('t1_score').value = '0';
                
                document.getElementById('t2_search').value = '';
                document.getElementById('t2_logo_url').value = '';
                document.getElementById('t2_img_preview').src = emptyLogo;
                document.getElementById('t2_status').innerText = 'Vazio';
                document.getElementById('t2_status').style.color = '#888';
                document.getElementById('t2_sigla').value = '';
                document.getElementById('t2_score').value = '0';
                
                resetColor(1);
                resetColor(2);
                
                // Atualiza o overlay com as caixas vazias
                sendDataToOBS();
            }
        }

        function sendDataToOBS() {
            const data = {
                t1_logo: document.getElementById('t1_logo_url').value,
                t1_sigla: document.getElementById('t1_sigla').value,
                t1_score: document.getElementById('t1_score').value,
                t1_color: document.getElementById('t1_color').value,
                t2_logo: document.getElementById('t2_logo_url').value,
                t2_sigla: document.getElementById('t2_sigla').value,
                t2_score: document.getElementById('t2_score').value,
                t2_color: document.getElementById('t2_color').value
            };
            localStorage.setItem('vlr_overlay_data', JSON.stringify(data));
            if (client.connected) client.publish('vlr_overlay_br_' + room, JSON.stringify(data), { retain: true });
        }

        window.onload = () => {
            updateLinks();
            const lastData = localStorage.getItem('vlr_overlay_data');
            
            if (lastData) {
                // Se já tinha dados salvos na sessão, carrega
                const data = JSON.parse(lastData);
                document.getElementById('t1_logo_url').value = data.t1_logo || '';
                document.getElementById('t1_sigla').value = data.t1_sigla || '';
                document.getElementById('t1_score').value = data.t1_score || '0';
                document.getElementById('t1_color').value = data.t1_color || '#16e28a';
                
                document.getElementById('t2_logo_url').value = data.t2_logo || '';
                document.getElementById('t2_sigla').value = data.t2_sigla || '';
                document.getElementById('t2_score').value = data.t2_score || '0';
                document.getElementById('t2_color').value = data.t2_color || '#f21941';
                
                if(data.t1_logo) document.getElementById('t1_img_preview').src = data.t1_logo;
                if(data.t2_logo) document.getElementById('t2_img_preview').src = data.t2_logo;
            }
        };
    </script>
</body>
</html>
