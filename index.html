<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Overlay - Valorant Broadcast</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <style>
        /* Reset e Estrutura Principal */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; display: flex; height: 100vh; width: 100vw; overflow: hidden; }
        
        /* Painel Lateral Esquerdo (Controles) */
        .left-panel { width: 450px; min-width: 450px; background: #161616; padding: 25px; border-right: 2px solid #16e28a; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; box-shadow: 5px 0 20px rgba(0,0,0,0.5); z-index: 10; position: relative;}
        
        /* Estilização da barra de rolagem do painel */
        .left-panel::-webkit-scrollbar { width: 8px; }
        .left-panel::-webkit-scrollbar-track { background: #111; }
        .left-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .left-panel::-webkit-scrollbar-thumb:hover { background: #16e28a; }

        /* Painel Lateral Direito (Preview) */
        .right-panel { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }

        /* Estrutura do Wrapper que segura e dimensiona o Overlay + Vídeo */
        .iframe-wrapper { 
            width: 1920px; 
            height: 1080px; 
            transform-origin: center center; 
            background: transparent; 
            position: relative; 
            z-index: 1; 
        }

        /* O Vídeo agora fica DENTRO do wrapper (1920x1080 travado) */
        .preview-bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; 
            opacity: 0.5; /* 50% de opacidade */
            z-index: 0; /* Fica no fundo */
            pointer-events: none;
        }

        /* O Iframe fica sobreposto ao vídeo */
        iframe { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none; 
            pointer-events: none; 
            background: transparent; 
            z-index: 1; /* Fica por cima do vídeo */
        }

        /* Link Flutuante Copiável */
        .floating-url { position: absolute; bottom: 40px; background: rgba(10, 10, 10, 0.85); border: 1px solid #16e28a; padding: 15px 25px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(5px); transition: all 0.2s ease; z-index: 20; max-width: 80%; }
        .floating-url:hover { background: rgba(22, 226, 138, 0.15); transform: translateY(-3px); border-color: #1aff9d; }
        .floating-url:active { transform: translateY(1px); }
        .floating-url .icon { font-size: 20px; }
        .floating-url .text-box { display: flex; flex-direction: column; }
        .floating-url .label { font-size: 11px; color: #aaa; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .floating-url .url { font-family: monospace; color: #16e28a; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; }

        /* Estilos dos Componentes do Painel */
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .header-box h2 { margin: 0; color: #16e28a; font-size: 22px; }
        .btn-clear { background: #f21941; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 12px; }
        .btn-clear:hover { background: #c11232; }

        .connection-box { background: #1a222c; padding: 15px; border-radius: 6px; border: 1px solid #2a4163; display: flex; flex-direction: column; gap: 10px; }
        .connection-box .row { display: flex; justify-content: space-between; align-items: center; }
        .connection-box input { border: 1px solid #444; width: 120px; font-family: monospace; text-align: center; font-size: 14px; color: #0f0; background: #000; padding: 5px; border-radius: 4px;}
        #status { font-weight: bold; color: orange; font-size: 13px; }

        .team-section { background: #1c1c1c; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { color: #aaa; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        input[type="text"], input[type="number"] { padding: 10px; background: #0a0a0a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box;}
        input[type="color"] { height: 40px; padding: 2px; cursor: pointer; width: 100%; border: none; transition: 0.3s; background: transparent;}
        
        .search-box { display: flex; gap: 8px; }
        .search-box input { flex-grow: 1; }
        .search-box button, .btn-upload-trigger { background: #333; color: white; border: 1px solid #555; padding: 0 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center;}
        .search-box button:hover, .btn-upload-trigger:hover { background: #444; }

        .logo-preview-container { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; background: #0a0a0a; padding: 10px; border-radius: 6px; border: 1px solid #333;}
        .logo-preview-container img { width: 45px; height: 45px; object-fit: contain; }
        .logo-preview-container .status { font-size: 12px; color: #888; font-weight: 500;}
        .logo-url-input { display: none; }

        .color-actions { display: flex; gap: 5px; margin-bottom: 5px; }
        .btn-small { background: #333; color: #fff; border: 1px solid #555; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; flex-grow: 1; transition: 0.2s; }
        .btn-small:hover { background: #444; }

        button.btn-primary { width: 100%; padding: 20px; background: #16e28a; color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; margin-top: 10px; box-shadow: 0 4px 15px rgba(22, 226, 138, 0.2); text-transform: uppercase; letter-spacing: 1px;}
        button.btn-primary:hover { background: #12b870; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(22, 226, 138, 0.3);}
        button.btn-primary:active { transform: translateY(0px); }

        @media (max-width: 1000px) {
            body { flex-direction: column; overflow: auto;}
            .left-panel { width: 100%; min-width: 100%; border-right: none; border-bottom: 2px solid #16e28a; }
            .right-panel { min-height: 50vh; }
            .floating-url { bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="header-box">
            <h2>CONTROLE BROADCAST</h2>
            <button class="btn-clear" onclick="clearAllData()">🗑️ Limpar</button>
        </div>

        <div class="connection-box">
            <div class="row">
                <label style="color:#fff;">🔑 Sala de Sincronização:</label>
                <input type="text" id="roomId" onchange="updateLinks()">
            </div>
            <div class="row">
                <label style="color:#aaa; font-size: 11px;">STATUS DA NUVEM:</label>
                <span id="status">Conectando...</span>
            </div>
        </div>

        <div class="team-section">
            <h3 style="margin-top: 0; margin-bottom: 15px; color: #16e28a;">TIME ESQUERDA</h3>
            
            <div class="form-group">
                <label>Buscar no VLR ou Upload:</label>
                <div class="search-box">
                    <input type="text" id="t1_search" placeholder="Ex: LOUD">
                    <button onclick="searchLogoVLR(1)" title="Buscar no VLR">🔍</button>
                    <button class="btn-upload-trigger" onclick="document.getElementById('t1_upload').click()" title="Upload de Arquivo">📁</button>
                    <input type="file" id="t1_upload" accept="image/*" style="display:none" onchange="handleFileUpload(1, event)">
                </div>
            </div>

            <div class="logo-preview-container">
                <img id="t1_img_preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23333'/><text x='50%' y='55%' fill='white' font-size='40' text-anchor='middle'>?</text></svg>">
                <span id="t1_status" class="status">Vazio</span>
            </div>
            <input type="text" id="t1_logo_url" class="logo-url-input">

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 2;"><label>Sigla Overlay:</label><input type="text" id="t1_sigla" value="TM1"></div>
                <div class="form-group" style="flex: 1;"><label>Rounds:</label><input type="number" id="t1_score" value="0"></div>
            </div>
            
            <div class="form-group">
                <label>Cor da Base:</label>
                <div class="color-actions">
                    <button class="btn-small" onclick="adaptColor(1)">🎨 Adaptar Cor da Logo</button>
                    <button class="btn-small" onclick="resetColor(1)">🔄 Restaurar Padrão</button>
                </div>
                <input type="color" id="t1_color" value="#16e28a">
            </div>
        </div>

        <div class="team-section">
            <h3 style="margin-top: 0; margin-bottom: 15px; color: #f21941;">TIME DIREITA</h3>
            
            <div class="form-group">
                <label>Buscar no VLR ou Upload:</label>
                <div class="search-box">
                    <input type="text" id="t2_search" placeholder="Ex: Sentinels">
                    <button onclick="searchLogoVLR(2)" title="Buscar no VLR">🔍</button>
                    <button class="btn-upload-trigger" onclick="document.getElementById('t2_upload').click()" title="Upload de Arquivo">📁</button>
                    <input type="file" id="t2_upload" accept="image/*" style="display:none" onchange="handleFileUpload(2, event)">
                </div>
            </div>

            <div class="logo-preview-container">
                <img id="t2_img_preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23333'/><text x='50%' y='55%' fill='white' font-size='40' text-anchor='middle'>?</text></svg>">
                <span id="t2_status" class="status">Vazio</span>
            </div>
            <input type="text" id="t2_logo_url" class="logo-url-input">

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 2;"><label>Sigla Overlay:</label><input type="text" id="t2_sigla" value="TM2"></div>
                <div class="form-group" style="flex: 1;"><label>Rounds:</label><input type="number" id="t2_score" value="0"></div>
            </div>
            
            <div class="form-group">
                <label>Cor da Base:</label>
                <div class="color-actions">
                    <button class="btn-small" onclick="adaptColor(2)">🎨 Adaptar Cor da Logo</button>
                    <button class="btn-small" onclick="resetColor(2)">🔄 Restaurar Padrão</button>
                </div>
                <input type="color" id="t2_color" value="#f21941">
            </div>
        </div>

        <button class="btn-primary" onclick="sendDataToOBS()">ATUALIZAR OVERLAY</button>
        <input type="hidden" id="obsLink">
    </div>

    <div class="right-panel" id="preview-container">
        
        <div class="iframe-wrapper" id="iframe-wrapper">
            
            <video class="preview-bg-video" autoplay loop muted playsinline>
                <source src="background.mp4" type="video/mp4">
            </video>

            <iframe id="previewIframe" src=""></iframe>
            
        </div>

        <div class="floating-url" id="floatingUrlBtn" onclick="copyOverlayUrl()">
            <div class="icon">🔗</div>
            <div class="text-box">
                <span class="label">Link para Fonte de Navegador do OBS (Clique para Copiar)</span>
                <span class="url" id="url-text">Gerando link...</span>
            </div>
            <div class="icon" style="color: #aaa; font-size: 16px;">📋</div>
        </div>
    </div>

    <script>
        // ==========================================
        // MOTOR DE ESCALA DINÂMICA DO PREVIEW
        // ==========================================
        function resizePreview() {
            const container = document.getElementById('preview-container');
            const wrapper = document.getElementById('iframe-wrapper');
            
            const targetRatio = 1920 / 1080; 
            const containerRatio = container.clientWidth / container.clientHeight;

            let scale;
            if (containerRatio > targetRatio) {
                scale = (container.clientHeight - 60) / 1080;
            } else {
                scale = (container.clientWidth - 60) / 1920; 
            }
            
            wrapper.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', resizePreview);
        setTimeout(resizePreview, 100); 

        // ==========================================
        // SISTEMA DE CÓPIA DO LINK FLUTUANTE
        // ==========================================
        function copyOverlayUrl() {
            const url = document.getElementById('obsLink').value;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.getElementById('floatingUrlBtn');
                const label = btn.querySelector('.label');
                
                btn.style.background = 'rgba(22, 226, 138, 0.9)';
                btn.style.borderColor = '#fff';
                label.innerText = "COPIADO PARA A ÁREA DE TRANSFERÊNCIA!";
                label.style.color = "#000";
                btn.querySelector('.url').style.color = "#000";
                
                setTimeout(() => {
                    btn.style.background = 'rgba(10, 10, 10, 0.85)';
                    btn.style.borderColor = '#16e28a';
                    label.innerText = "Link para Fonte de Navegador do OBS (Clique para Copiar)";
                    label.style.color = "#aaa";
                    btn.querySelector('.url').style.color = "#16e28a";
                }, 2000);
            });
        }

        // ==========================================
        // CÓDIGO FUNCIONAL DO PAINEL
        // ==========================================
        const emptyLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23333'/><text x='50%' y='55%' fill='white' font-size='40' text-anchor='middle'>?</text></svg>";

        let room = localStorage.getItem('vlr_room_id') || Math.random().toString(36).substring(2, 8).toUpperCase();
        localStorage.setItem('vlr_room_id', room);
        document.getElementById('roomId').value = room;

        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => {
            document.getElementById('status').innerText = "🟢 Online"; document.getElementById('status').style.color = "#0f0";
        });

        function updateLinks() {
            const currentRoom = document.getElementById('roomId').value;
            localStorage.setItem('vlr_room_id', currentRoom);
            let basePath = window.location.href.split('?')[0].replace('index.html', 'overlay.html');
            if(!basePath.endsWith('overlay.html')) basePath += 'overlay.html';
            const finalUrl = basePath + '?room=' + currentRoom;
            
            document.getElementById('obsLink').value = finalUrl;
            document.getElementById('url-text').innerText = finalUrl;
            document.getElementById('previewIframe').src = finalUrl;
        }

        const rgbToHex = (r, g, b) => '#' + [r, g, b].map(x => {
            const hex = x.toString(16);
            return hex.length === 1 ? '0' + hex : hex;
        }).join('');

        function resetColor(teamNum) {
            if (teamNum === 1) document.getElementById('t1_color').value = '#16e28a';
            if (teamNum === 2) document.getElementById('t2_color').value = '#f21941';
        }

        function handleFileUpload(teamNum, event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusLabel = document.getElementById(`t${teamNum}_status`);
            statusLabel.innerText = "⏳ Processando...";
            statusLabel.style.color = "orange";

            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 150; 
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const base64Image = canvas.toDataURL('image/png');

                    document.getElementById(`t${teamNum}_logo_url`).value = base64Image;
                    document.getElementById(`t${teamNum}_img_preview`).src = base64Image;
                    statusLabel.innerText = "✅ Upload concluído!";
                    statusLabel.style.color = "#16e28a";
                    resetColor(teamNum);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function searchLogoVLR(teamNum) {
            const query = document.getElementById(`t${teamNum}_search`).value.trim();
            if(!query) return;

            const statusLabel = document.getElementById(`t${teamNum}_status`);
            statusLabel.innerText = "⏳ Buscando...";
            statusLabel.style.color = "#aaa";

            const proxies = [
                `https://corsproxy.io/?https://www.vlr.gg/search/?q=${encodeURIComponent(query)}`,
                `https://api.codetabs.com/v1/proxy?quest=https://www.vlr.gg/search/?q=${encodeURIComponent(query)}`
            ];

            let html = null;
            for (let proxy of proxies) {
                try {
                    const response = await fetch(proxy);
                    if (response.ok) { html = await response.text(); break; }
                } catch (e) {}
            }

            if (!html) { statusLabel.innerText = "❌ Erro Proxy"; return; }

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");
                let foundLogo = null;
                const results = doc.querySelectorAll('a.search-item');
                for (let item of results) {
                    if (item.getAttribute('href').includes('/team/')) {
                        const img = item.querySelector('img');
                        if (img && !img.src.includes('vlr.png')) {
                            foundLogo = img.getAttribute('src');
                            if (foundLogo.startsWith('//')) foundLogo = 'https:' + foundLogo;
                            break;
                        }
                    }
                }

                if (foundLogo) {
                    document.getElementById(`t${teamNum}_logo_url`).value = foundLogo;
                    document.getElementById(`t${teamNum}_img_preview`).src = foundLogo;
                    
                    let autoSigla = query.substring(0, 3).toUpperCase();
                    document.getElementById(`t${teamNum}_sigla`).value = autoSigla;
                    
                    statusLabel.innerText = "✅ Encontrado!";
                    statusLabel.style.color = "#16e28a";
                    resetColor(teamNum);
                } else {
                    statusLabel.innerText = "❌ Não achou";
                }
            } catch (e) { statusLabel.innerText = "❌ Erro"; }
        }

        async function adaptColor(teamNum) {
            const logoUrl = document.getElementById(`t${teamNum}_logo_url`).value;
            if (!logoUrl) return;
            const statusLabel = document.getElementById(`t${teamNum}_status`);
            
            const imgForColor = new Image();
            imgForColor.crossOrigin = "Anonymous";
            
            imgForColor.src = logoUrl.startsWith('data:') ? logoUrl : `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(logoUrl)}`;
            
            imgForColor.onload = () => {
                const colorThief = new ColorThief();
                const color = colorThief.getColor(imgForColor);
                let r = color[0], g = color[1], b = color[2];
                const brilho = (r * 299 + g * 587 + b * 114) / 1000;
                if (brilho > 50) { r *= 0.4; g *= 0.4; b *= 0.4; } 
                else { r += (150-r)*0.4; g += (150-g)*0.4; b += (150-b)*0.4; }
                document.getElementById(`t${teamNum}_color`).value = rgbToHex(Math.floor(r), Math.floor(g), Math.floor(b));
                statusLabel.innerText = "🎨 Cor adaptada!";
            };
        }

        function clearAllData() {
            if(confirm("Tem certeza que deseja zerar o placar e remover os times?")) {
                localStorage.removeItem('vlr_overlay_data');
                
                document.getElementById('t1_search').value = '';
                document.getElementById('t1_logo_url').value = '';
                document.getElementById('t1_img_preview').src = emptyLogo;
                document.getElementById('t1_status').innerText = 'Vazio';
                document.getElementById('t1_status').style.color = '#888';
                document.getElementById('t1_sigla').value = 'TM1';
                document.getElementById('t1_score').value = '0';
                
                document.getElementById('t2_search').value = '';
                document.getElementById('t2_logo_url').value = '';
                document.getElementById('t2_img_preview').src = emptyLogo;
                document.getElementById('t2_status').innerText = 'Vazio';
                document.getElementById('t2_status').style.color = '#888';
                document.getElementById('t2_sigla').value = 'TM2';
                document.getElementById('t2_score').value = '0';
                
                resetColor(1);
                resetColor(2);
                
                sendDataToOBS();
            }
        }

        function sendDataToOBS() {
            const data = {
                t1_logo: document.getElementById('t1_logo_url').value,
                t1_sigla: document.getElementById('t1_sigla').value,
                t1_score: document.getElementById('t1_score').value,
                t1_color: document.getElementById('t1_color').value,
                t2_logo: document.getElementById('t2_logo_url').value,
                t2_sigla: document.getElementById('t2_sigla').value,
                t2_score: document.getElementById('t2_score').value,
                t2_color: document.getElementById('t2_color').value
            };
            localStorage.setItem('vlr_overlay_data', JSON.stringify(data));
            if (client.connected) client.publish('vlr_overlay_br_' + room, JSON.stringify(data), { retain: true });
        }

        window.onload = () => {
            updateLinks();
            const lastData = localStorage.getItem('vlr_overlay_data');
            
            if (lastData) {
                const data = JSON.parse(lastData);
                document.getElementById('t1_logo_url').value = data.t1_logo || '';
                document.getElementById('t1_sigla').value = data.t1_sigla || 'TM1';
                document.getElementById('t1_score').value = data.t1_score || '0';
                document.getElementById('t1_color').value = data.t1_color || '#16e28a';
                
                document.getElementById('t2_logo_url').value = data.t2_logo || '';
                document.getElementById('t2_sigla').value = data.t2_sigla || 'TM2';
                document.getElementById('t2_score').value = data.t2_score || '0';
                document.getElementById('t2_color').value = data.t2_color || '#f21941';
                
                if(data.t1_logo) document.getElementById('t1_img_preview').src = data.t1_logo;
                if(data.t2_logo) document.getElementById('t2_img_preview').src = data.t2_logo;
            } else {
                sendDataToOBS();
            }
        };
    </script>
</body>
</html>
