<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Overlay - Valorant Live</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0;}
        .panel { background: #222; padding: 20px; border-radius: 8px; width: 100%; max-width: 850px; box-sizing: border-box;}
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .team-section { background: #1a1a1a; padding: 15px; border-radius: 8px; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { color: #aaa; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        input { padding: 10px; background: #000; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 15px; }
        input[type="color"] { height: 40px; padding: 2px; cursor: pointer; width: 100%; border: none; }
        
        button.btn-primary { width: 100%; padding: 18px; background: #ff4655; color: white; border: none; border-radius: 4px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.2s; margin-top: 15px;}
        button.btn-primary:hover { background: #ff2a3b; }

        .connection-box { background: #152438; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #2a4163; display: flex; gap: 15px; align-items: center; justify-content: space-between; }
        .connection-box input { border: 1px solid #444; width: 150px; font-family: monospace; text-align: center; font-size: 16px; color: #0f0; }
        
        .url-section { background: #000; padding: 15px; border-radius: 6px; margin-top: 20px; border: 1px dashed #555; display: flex; flex-direction: column; gap: 10px;}
        .url-section p { margin: 0; color: #aaa; font-size: 13px; text-align: center; }
        .url-section input { border: 1px solid #ff4655; color: #0f0; text-align: center; font-family: monospace; }
        button.btn-copy { background: #333; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button.btn-copy:hover { background: #444; }
        
        #status { font-weight: bold; color: orange; font-size: 14px; }
        
        .preview-box { margin-top: 30px; width: 800px; height: 450px; background: #333; border: 4px solid #222; position: relative; overflow: hidden; }
        iframe { width: 1920px; height: 1080px; border: none; transform: scale(0.4166); transform-origin: top left; pointer-events: none; }
        h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        @media (max-width: 700px) {
            .grid { grid-template-columns: 1fr; gap: 10px; }
            .preview-title, .preview-box, .url-section { display: none; } 
            .connection-box { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="panel">
        <h2 style="text-align: center; margin: 0 0 15px 0; color: #ff4655;">CONTROLE BROADCAST (ONLINE)</h2>

        <div class="connection-box">
            <div>
                <label style="color:#fff;">🔑 ID da Sala de Sincronização:</label>
                <div style="color:#aaa; font-size: 11px;">Mantenha o mesmo no OBS e neste painel</div>
            </div>
            <input type="text" id="roomId" onchange="updateLinks()">
            <span id="status">Conectando ao servidor...</span>
        </div>

        <div class="grid">
            <div class="team-section">
                <h3>TIME ESQUERDA</h3>
                <div class="form-group"><label>Arquivo da Logo:</label><input type="text" id="t1_file" value="Sentinels"></div>
                <div class="form-group"><label>Sigla Overlay:</label><input type="text" id="t1_sigla" value="SEN"></div>
                <div class="form-group"><label>Rounds:</label><input type="number" id="t1_score" value="0"></div>
                <div class="form-group"><label>Cor:</label><input type="color" id="t1_color" value="#ff4655"></div>
            </div>

            <div class="team-section">
                <h3>TIME DIREITA</h3>
                <div class="form-group"><label>Arquivo da Logo:</label><input type="text" id="t2_file" value="Evil Geniuses"></div>
                <div class="form-group"><label>Sigla Overlay:</label><input type="text" id="t2_sigla" value="EG"></div>
                <div class="form-group"><label>Rounds:</label><input type="number" id="t2_score" value="0"></div>
                <div class="form-group"><label>Cor:</label><input type="color" id="t2_color" value="#152438"></div>
            </div>
        </div>

        <button class="btn-primary" onclick="sendDataToOBS()">ATUALIZAR OVERLAY NA LIVE</button>

        <div class="url-section">
            <p>1. Copie o link abaixo e cole como Fonte de Navegador no OBS.</p>
            <p>2. Depois disso, você só precisará clicar no botão vermelho acima!</p>
            <input type="text" id="obsLink" readonly onclick="this.select()">
            <button class="btn-copy" onclick="copyUrl()">📋 Copiar Link Fixo para o OBS</button>
        </div>
    </div>

    <h3 class="preview-title" style="margin-top: 20px;">PREVIEW (16:9)</h3>
    <div class="preview-box">
        <iframe id="previewIframe" src=""></iframe>
    </div>

    <script>
        // 1. Gera ou recupera um ID de Sala aleatório
        let room = localStorage.getItem('vlr_room_id');
        if (!room) {
            room = Math.random().toString(36).substring(2, 8).toUpperCase();
            localStorage.setItem('vlr_room_id', room);
        }
        document.getElementById('roomId').value = room;

        // 2. Conecta ao Servidor Online (MQTT)
        const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        
        client.on('connect', () => {
            document.getElementById('status').innerText = "🟢 Online";
            document.getElementById('status').style.color = "#0f0";
        });

        client.on('error', () => {
            document.getElementById('status').innerText = "🔴 Desconectado";
            document.getElementById('status').style.color = "#ff4655";
        });

        // 3. Função para gerar os links do OBS e Preview
        function updateLinks() {
            const currentRoom = document.getElementById('roomId').value;
            localStorage.setItem('vlr_room_id', currentRoom); // Salva se o usuário mudar a sala
            
            let basePath = window.location.href.split('?')[0];
            if (basePath.endsWith('index.html')) basePath = basePath.replace('index.html', 'overlay.html');
            else if (basePath.endsWith('/')) basePath += 'overlay.html';
            else basePath += '/overlay.html';
            
            const finalUrl = basePath + '?room=' + currentRoom;
            
            document.getElementById('obsLink').value = finalUrl;
            document.getElementById('previewIframe').src = finalUrl;
        }

        // 4. Envia os dados pelo ar para o OBS
        function sendDataToOBS() {
            const data = {
                t1_file: document.getElementById('t1_file').value,
                t1_sigla: document.getElementById('t1_sigla').value,
                t1_score: document.getElementById('t1_score').value,
                t1_color: document.getElementById('t1_color').value,
                t2_file: document.getElementById('t2_file').value,
                t2_sigla: document.getElementById('t2_sigla').value,
                t2_score: document.getElementById('t2_score').value,
                t2_color: document.getElementById('t2_color').value
            };

            const currentRoom = document.getElementById('roomId').value;
            const topico = 'vlr_overlay_br_' + currentRoom;

            // Envia para o servidor. O "retain: true" garante que se o OBS for aberto DEPOIS, ele puxa o último placar.
            if (client.connected) {
                client.publish(topico, JSON.stringify(data), { retain: true });
            } else {
                alert("Servidor desconectado. Verifique sua internet.");
            }

            // Salva na memória local só por segurança
            localStorage.setItem('vlr_overlay_data', JSON.stringify(data));
        }

        function copyUrl() {
            const copyText = document.getElementById("obsLink");
            copyText.select();
            document.execCommand("copy");
            alert("✅ Link Fixo copiado! Cole no OBS. Você nunca mais precisará trocar este link.");
        }

        // Ao abrir a página
        window.onload = () => {
            updateLinks(); // Gera o link do iframe e OBS
            const lastData = localStorage.getItem('vlr_overlay_data');
            if (lastData) {
                const data = JSON.parse(lastData);
                document.getElementById('t1_file').value = data.t1_file || 'Sentinels';
                document.getElementById('t1_sigla').value = data.t1_sigla || 'SEN';
                document.getElementById('t1_score').value = data.t1_score || '0';
                document.getElementById('t1_color').value = data.t1_color || '#ff4655';
                document.getElementById('t2_file').value = data.t2_file || 'Evil Geniuses';
                document.getElementById('t2_sigla').value = data.t2_sigla || 'EG';
                document.getElementById('t2_score').value = data.t2_score || '0';
                document.getElementById('t2_color').value = data.t2_color || '#152438';
            }
            // Envia o estado atual para o OBS já iniciar certo
            setTimeout(sendDataToOBS, 1000); 
        };
    </script>
</body>
</html>
