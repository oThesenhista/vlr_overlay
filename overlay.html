<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Overlay Valorant - Hybrid Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Blinker:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --color-t1: #16e28a; --color-t2: #f21941; }

        body { margin: 0; padding: 0; background-color: transparent; color: white; font-family: 'Blinker', sans-serif; overflow: hidden; width: 1920px; height: 1080px; }
        .hud-top { position: absolute; top: -5px; left: 0; width: 100%; display: flex; justify-content: center; align-items: flex-start; }

        /* --- TIME ESQUERDO --- */
        .team-left { position: absolute; left: 300px; display: flex; flex-direction: column; align-items: center; }
        .team-left .logo-box { width: 150px; height: 55px; z-index: 0; margin-top: -5px; padding-left: 10px; background: linear-gradient(to right, var(--color-t1) 0%, transparent 100%); transform: skewX(-15deg); display: flex; justify-content: left; align-items: center; transition: background 0.3s; }
        .team-left .name-box { background-color: #111; z-index: 1; border-top: 3px solid var(--color-t1); min-width: 30px; padding: 0px 30px; transform: skewX(-15deg); margin-top: 6px;  margin-left:100px;}
        .team-left .logo-box img, .team-left .name-box span { transform: skewX(15deg); display: block; }

        /* --- TIME DIREITO --- */
        .team-right { position: absolute; right: 320px; display: flex; flex-direction: column; align-items: center; }
        .team-right .logo-box { width: 150px; height: 55px;  z-index: 0; margin-top: -5px; padding-right: 10px; background: linear-gradient(to left, var(--color-t2) 0%, transparent 100%); transform: skewX(15deg); display: flex; justify-content: right; align-items: center; transition: background 0.3s; }
        .team-right .name-box { background-color: #111; z-index: 1; border-top: 3px solid var(--color-t2); min-width: 30px; padding: 0px 30px; transform: skewX(15deg); margin-top: 6px; margin-left:-100px;}
        .team-right .logo-box img, .team-right .name-box span { transform: skewX(-15deg); display: block; }

        /* --- CENTRO --- */
        .score-center { display: flex; gap: 35px; margin-top: 70px; }
        
        .score-box { width: 70px; height: 50px; display: flex; justify-content: center; align-items: center; }
        
        .score-box.left { 
            transform: skewX(15deg); 
            border-right: 3px solid var(--color-t1);
            background: linear-gradient(to left, rgba(0,0,0,0.9) 50%, transparent 100%);
        }
        
        .score-box.right { 
            transform: skewX(-15deg); 
            border-left: 3px solid var(--color-t2);
            background: linear-gradient(to right, rgba(0,0,0,0.9) 50%, transparent 100%);
        }

        .score-box.left span { transform: skewX(-15deg); transition: 0.3s;}
        .score-box.right span { transform: skewX(15deg); transition: 0.3s;}

        .logo-box img { height: 45px; width: 45px; object-fit: contain; }
        .name-box span { font-size: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
        .score-box span { font-size: 36px; font-weight: 600; }
        
        #conn-status { position: absolute; top: 10px; left: 10px; font-size: 12px; font-weight: bold; padding: 5px 10px; background: rgba(0,0,0,0.5); border-radius: 4px; }
    </style>
</head>
<body>

    <div id="conn-status" style="color: orange;">Aguardando Conexão...</div>

    <div class="hud-top">
        <div class="team-left">
            <div class="name-box"><span id="name-t1">TM1</span></div>
            <div class="logo-box" id="bg-t1"><img id="logo-t1"></div>
        </div>
        <div class="score-center">
            <div class="score-box left"><span id="score-t1">0</span></div>
            <div class="score-box right"><span id="score-t2">0</span></div>
        </div>
        <div class="team-right">
            <div class="name-box"><span id="name-t2">TM2</span></div>
            <div class="logo-box" id="bg-t2"><img id="logo-t2"></div> 
        </div>
    </div>

    <script>
        const emptyLogo = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23222'/><text x='50%' y='55%' fill='%23666' font-size='50' font-family='Arial' font-weight='bold' text-anchor='middle' dominant-baseline='middle'>?</text></svg>";
        document.getElementById('logo-t1').src = emptyLogo;
        document.getElementById('logo-t2').src = emptyLogo;

        function updateUI(data) {
            if (!data) return;

            // Proteção: Se a sigla vier vazia do painel, usa TM1 e TM2
            document.getElementById('name-t1').innerText = data.t1_sigla || 'TM1';
            document.getElementById('name-t2').innerText = data.t2_sigla || 'TM2';
            
            document.getElementById('score-t1').innerText = data.t1_score || '0';
            document.getElementById('score-t2').innerText = data.t2_score || '0';
            
            document.documentElement.style.setProperty('--color-t1', data.t1_color || '#16e28a');
            document.documentElement.style.setProperty('--color-t2', data.t2_color || '#f21941');

            const imgT1 = document.getElementById('logo-t1');
            imgT1.onerror = () => { imgT1.onerror = null; imgT1.src = emptyLogo; };
            imgT1.src = data.t1_logo || emptyLogo;

            const imgT2 = document.getElementById('logo-t2');
            imgT2.onerror = () => { imgT2.onerror = null; imgT2.src = emptyLogo; };
            imgT2.src = data.t2_logo || emptyLogo;
        }

        const statusBox = document.getElementById('conn-status');

        const localData = localStorage.getItem('vlr_overlay_data');
        if (localData) updateUI(JSON.parse(localData));

        window.addEventListener('storage', (event) => {
            if (event.key === 'vlr_overlay_data') {
                updateUI(JSON.parse(event.newValue));
                statusBox.innerText = "⚡ Sincronização Local";
                statusBox.style.color = "#16e28a";
                setTimeout(() => statusBox.style.display = 'none', 1000);
            }
        });

        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');

        if (!room) {
            statusBox.innerText = "❌ Nenhuma Sala Cloud. Rodando Localmente.";
            statusBox.style.color = "gray";
            setTimeout(() => statusBox.style.display = 'none', 3000);
        } else {
            const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            client.on('connect', () => {
                statusBox.innerText = "🟢 Conectado Cloud";
                statusBox.style.color = "#0f0";
                setTimeout(() => statusBox.style.display = 'none', 3000);
                client.subscribe('vlr_overlay_br_' + room);
            });
            client.on('message', (topic, message) => {
                try { updateUI(JSON.parse(message.toString())); } catch(e){}
            });
            client.on('error', () => {
                statusBox.style.display = 'block';
                statusBox.innerText = "🔴 Cloud Offline. Rodando apenas Local.";
                statusBox.style.color = "orange";
            });
        }
    </script>
</body>
</html>
