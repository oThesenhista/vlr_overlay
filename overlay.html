<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Overlay Valorant - Online Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Blinker:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root { --color-t1: #ff4655; --color-t2: #152438; }

        body {
            margin: 0; padding: 0;
            background-color: transparent;
            color: white;
            font-family: 'Blinker', sans-serif;
            overflow: hidden;
            width: 1920px; height: 1080px;
        }

        .hud-top {
            position: absolute;
            top: 25px; left: 0; width: 100%;
            display: flex; justify-content: center; align-items: flex-start;
        }

        /* --- TIME ESQUERDO --- */
        .team-left { position: absolute; left: 320px; display: flex; flex-direction: column; align-items: center; }
        .team-left .logo-box {
            width: 100px; height: 55px; background-color: var(--color-t1);
            transform: skewX(-15deg); display: flex; justify-content: center; align-items: center; transition: 0.3s;
        }
        .team-left .name-box { background-color: #111; padding: 2px 30px; transform: skewX(-15deg); margin-top: 6px; }
        .team-left .logo-box img, .team-left .name-box span { transform: skewX(15deg); display: block; }

        /* --- TIME DIREITO --- */
        .team-right { position: absolute; right: 320px; display: flex; flex-direction: column; align-items: center; }
        .team-right .logo-box {
            width: 100px; height: 55px; background-color: var(--color-t2);
            transform: skewX(15deg); display: flex; justify-content: center; align-items: center; transition: 0.3s;
        }
        .team-right .name-box { background-color: #111; padding: 2px 30px; transform: skewX(15deg); margin-top: 6px; }
        .team-right .logo-box img, .team-right .name-box span { transform: skewX(-15deg); display: block; }

        /* --- ELEMENTOS CENTRAIS --- */
        .score-center { display: flex; gap: 15px; margin-top: 70px; }
        .score-box { background-color: #000; width: 70px; height: 50px; display: flex; justify-content: center; align-items: center; }
        .score-box.left { transform: skewX(15deg); }
        .score-box.right { transform: skewX(-15deg); }
        .score-box.left span { transform: skewX(-15deg); transition: 0.3s;}
        .score-box.right span { transform: skewX(15deg); transition: 0.3s;}

        /* --- TEXTOS E IMAGENS --- */
        .logo-box img { height: 45px; width: 45px; object-fit: contain; }
        .name-box span { font-size: 20px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
        .score-box span { font-size: 36px; font-weight: 600; }
        
        #conn-status { position: absolute; top: 10px; left: 10px; font-size: 12px; color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>

    <div id="conn-status">Aguardando Conexão...</div>

    <div class="hud-top">
        <div class="team-left">
            <div class="logo-box" id="bg-t1"><img id="logo-t1" src="logos/default.png"></div>
            <div class="name-box"><span id="name-t1">SEN</span></div>
        </div>
        <div class="score-center">
            <div class="score-box left"><span id="score-t1">0</span></div>
            <div class="score-box right"><span id="score-t2">0</span></div>
        </div>
        <div class="team-right">
            <div class="logo-box" id="bg-t2"><img id="logo-t2" src="logos/default.png"></div>
            <div class="name-box"><span id="name-t2">EG</span></div>
        </div>
    </div>

    <script>
        // Função visual para atualizar os dados
        function updateUI(data) {
            document.getElementById('name-t1').innerText = data.t1_sigla || 'SEN';
            document.getElementById('name-t2').innerText = data.t2_sigla || 'EG';
            document.getElementById('score-t1').innerText = data.t1_score || '0';
            document.getElementById('score-t2').innerText = data.t2_score || '0';

            document.documentElement.style.setProperty('--color-t1', data.t1_color || '#ff4655');
            document.documentElement.style.setProperty('--color-t2', data.t2_color || '#152438');

            const clean = (n) => {
                if (!n) return 'default';
                return n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '');
            };

            const setLogo = (id, fileName) => {
                const img = document.getElementById(id);
                img.onerror = function() { this.onerror = null; this.src = 'logos/default.png'; };
                img.src = `logos/${clean(fileName)}.png`;
            };

            setLogo('logo-t1', data.t1_file);
            setLogo('logo-t2', data.t2_file);
        }

        // ============================================
        // LÓGICA DE RECEBIMENTO ONLINE (MQTT WebSockets)
        // ============================================
        
        // Pega a Sala que está na URL
        const params = new URLSearchParams(window.location.search);
        const room = params.get('room');

        if (!room) {
            document.getElementById('conn-status').innerText = "Erro: Nenhuma Sala definida na URL.";
        } else {
            const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
            const topico = 'vlr_overlay_br_' + room;

            client.on('connect', () => {
                document.getElementById('conn-status').innerText = "Conectado à sala: " + room;
                // Esconde a mensagem depois de 3 segundos para não poluir a tela
                setTimeout(() => document.getElementById('conn-status').style.display = 'none', 3000);
                
                // Inscreve-se na sala
                client.subscribe(topico);
            });

            // Quando receber a mensagem do painel, atualiza!
            client.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    updateUI(data);
                } catch (e) {
                    console.log("Erro ao ler dados", e);
                }
            });

            client.on('error', () => {
                document.getElementById('conn-status').innerText = "Erro de conexão. Tentando reconectar...";
                document.getElementById('conn-status').style.display = 'block';
            });
        }
    </script>
</body>
</html>
